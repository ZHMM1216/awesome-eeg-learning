[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "awesome-eeg-learning"
version = "0.1.0"
description = "A Chinese-first, reproducible introduction to EEG paradigms and clinical research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "mne>=1.7",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
bci = ["moabb>=1.1", "pyriemann>=0.6"]
clinical = ["yasa>=0.6.5", "vitaldb>=1.5"]
deep = ["braindecode>=0.8", "torch>=2.2"]
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29"]
docs = ["mkdocs-material>=9.5"]
dev = ["pytest>=8.2", "ruff>=0.5", "jsonschema>=4.22"]

[project.scripts]
eeg-catalog = "eeg_starter.catalog:main"
eeg-data = "eeg_starter.data:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eeg_starter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
