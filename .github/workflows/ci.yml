name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[docs,dev]"
      - name: Validate catalog
        run: eeg-catalog
      - name: Check generated literature tables
        run: python scripts/render_literature.py --check
      - name: Check tutorial figures
        run: python scripts/generate_tutorial_figures.py --check
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Build documentation
        run: mkdocs build --strict

  online-catalog:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: eeg-catalog --online
